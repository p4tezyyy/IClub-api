name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag and versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          node = json.loads(Path('nodejs/package.json').read_text())['version']
          py = tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          assert node == py == tag.removeprefix('v'), f'Version mismatch: {node=} {py=} {tag=}'
          print(f'Validated {tag}')
          PY
  npm:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure modern npm for OIDC publishing
        run: npm install -g npm@^11
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Link package to this repository for trusted publishing
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: npm pkg set "repository.type=git" "repository.url=git+https://github.com/${GITHUB_REPO}.git"
      - name: Publish npm via configured Trusted Publisher
        run: npm publish --access public
  pypi-build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e './python[test]'
      - run: python -m pytest python/tests -q
      - run: python -m build ./python --sdist --wheel --outdir ./dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  pypi:
    runs-on: ubuntu-latest
    needs: pypi-build
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI via configured Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
